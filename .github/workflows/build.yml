name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the glibc floor at 2.35 so the binaries also run on
          # Raspberry Pi OS Bookworm (2.36) and other older distros.
          - os: ubuntu-22.04
            asset: OneTimePad-linux
          - os: ubuntu-22.04-arm
            asset: OneTimePad-linux-arm64
          - os: windows-latest
            asset: OneTimePad-windows.exe
          - os: macos-latest
            asset: OneTimePad-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build
        run: |
          python -m pip install pyinstaller
          pyinstaller --onefile --windowed --name OneTimePad onetimepad.py
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: mv dist/OneTimePad dist/${{ matrix.asset }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: move dist\OneTimePad.exe dist\${{ matrix.asset }}
        shell: cmd
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent OneTimePad.app ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}
